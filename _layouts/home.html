---
layout: page
---

{{ content }}

{% if site.blog.size > 0 %}
  {% for post in site.blog %}
    <article style="margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid #ddd;">
      <h2>{{ post.title }}</h2>
      
      {% if post.subtitle %}
        <h3 style="color: #666;">{{ post.subtitle }}</h3>
      {% endif %}
      
      <div style="display: flex; gap: 20px; align-items: flex-start;">
        
        <!-- Contenido de texto a la izquierda -->
        <div style="flex: 1; line-height: 1.6;">
          {{ post.content }}
        </div>
        
        <!-- Imagen a la derecha -->
        {% if post.cover-img %}
          <div style="flex: 0 0 250px;">
            <img src="{{ post.cover-img }}" alt="{{ post.title }}" style="width: 100%; height: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
          </div>
        {% endif %}
        
      </div>
    </article>
  {% endfor %}
{% else %}
  <p>No hay posts disponibles.</p>
{% endif %}
