---
layout: page
---

{{ content }}

{% assign posts = site.blog %}

<!-- role="list" needed so that `list-style: none` in Safari doesn't remove the list semantics -->
<ul>
  {% for post in posts %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
  {% endfor %}
</ul>
