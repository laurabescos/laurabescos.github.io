---
layout: page
---

{{ content }}

{% assign posts = site.blog %}

{% for post in posts %}
  <article>
    <h2>{{ post.title }}</h2>
    {% if post.subtitle %}
      <h3>{{ post.subtitle }}</h3>
    {% endif %}
    {% if post.cover-img %}
      <img src="{{ post.cover-img }}" alt="{{ post.title }}">
    {% endif %}
    <div>
      {{ post.content }}
    </div>
    <hr>
  </article>
{% endfor %}
