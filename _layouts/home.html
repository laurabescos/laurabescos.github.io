---
layout: page
---

{{ content }}

{% if site.blog.size > 0 %}
  {% for post in site.blog %}
    <article style="margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid #ddd;">
      <h2>{{ post.title }}</h2>
      
      {% if post.subtitle %}
        <h3 style="color: #666;">{{ post.subtitle }}</h3>
      {% endif %}
      
      {% if post.cover-img %}
        <img src="{{ post.cover-img }}" alt="{{ post.title }}" style="max-width: 100%; height: auto; margin: 15px 0;">
      {% endif %}
      
      <div style="line-height: 1.6;">
        {{ post.content }}
      </div>
    </article>
  {% endfor %}
{% else %}
  <p>No hay posts disponibles.</p>
{% endif %}
